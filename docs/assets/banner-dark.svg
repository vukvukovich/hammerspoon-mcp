<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hammerspoon MCP">
  <!-- Transparent background: the banner sits directly on GitHub's page. -->
  <!-- Monogram: rounded terminal chip -->
  <rect x="566" y="16" width="68" height="68" rx="16" stroke="#ffcc66" stroke-width="2.5"/>
  <text x="600" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#ffcc66">hs</text>
  <!-- Wordmark -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" letter-spacing="-0.5">
    <tspan font-weight="700" fill="#cbccc6">Hammerspoon</tspan>
    <tspan font-weight="400" fill="#ffcc66" dx="14">MCP</tspan>
  </text>
  <!-- Tagline -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#707a8c">Typed, injection-safe macOS automation for AI agents</text>
