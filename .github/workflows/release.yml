name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing authenticates to npm with this workflow's OIDC identity
  # instead of a long-lived token, so there is no NPM_TOKEN secret to store,
  # leak, or rotate. The same identity signs the provenance attestation.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # Same reasoning as ci.yml: nothing in the build or the checks needs macOS.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Never cache in a release build: a poisoned or stale cache would end
          # up inside a published artifact.
          cache: ''
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later and Node 22.14.0 or later.
      # Printing both makes a version-related 401 obvious instead of mysterious.
      - name: Report toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN and no --provenance flag.
      #
      # The npm CLI detects the OIDC environment and authenticates with it
      # automatically, and publishing this way generates provenance on its own.
      # Passing --provenance is unnecessary, and a token would defeat the point.
      #
      # This requires a trusted publisher configured on npmjs.com for the
      # package, pointing at this repository and the workflow filename
      # "release.yml". Until that exists, this step fails to authenticate.
      #
      # --access public stays: scoped packages default to restricted.
      - name: Publish
        run: npm publish --access public
